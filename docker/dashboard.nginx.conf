server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy handles TLS termination upstream; this is the internal plain-HTTP
    # service. Cache hashed assets, never cache index.html.
    # Edge headers (DEC-0060, etape 9.3) : defense in depth si le dashboard
    # est atteint sans passer par Caddy. Le bloc location /assets/ repete
    # les headers car tout add_header dans un location desactive
    # l'heritage du niveau server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
