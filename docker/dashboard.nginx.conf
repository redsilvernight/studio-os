server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy handles TLS termination upstream; this is the internal plain-HTTP
    # service. Cache hashed assets, never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
