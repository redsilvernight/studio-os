name: Desktop restore channel artefact

# Restores an older immutable artefact into the same living channel. Cross-lane
# beta/stable promotion is forbidden by DEC-0162 because Dev and Prod now carry
# different application identities and server origins. The installer's SHA-256
# is checked against the source manifest before anything is published.
#
# Triggers:
#   - workflow_dispatch only: choose one lane as both source and target, with a
#     `source_tag` that still holds the wanted channel-specific artefact.
#
# The target lane's GitHub environment (`desktop-prod` / `desktop-dev`) supplies
# STUDIO_DESKTOP_API_URL for the origin guard. The source release is never
# modified.

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Source lane"
        type: choice
        options: [beta, stable]
        default: beta
      to:
        description: "Target lane (must equal source lane)"
        type: choice
        options: [stable, beta]
        default: beta
      source_tag:
        description: "Release tag holding the artefact (default: the source lane release; or an older tag of the same lane to roll back; cross-lane sources are refused)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-promote-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ${{ inputs.to == 'stable' && 'desktop-prod' || 'desktop-dev' }}
    env:
      # Dev is always the packaged loopback server (DEC-0162); Prod reads its origin
      # from the desktop-prod environment.
      STUDIO_DESKTOP_API_URL: ${{ inputs.to == 'stable' && vars.STUDIO_DESKTOP_API_URL || 'http://127.0.0.1:8765' }}
      PROMOTE_FROM: ${{ inputs.from }}
      PROMOTE_TO: ${{ inputs.to }}
      PROMOTE_SOURCE_TAG: ${{ inputs.source_tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve lanes and releases
        shell: pwsh
        run: |
          function LaneTag([string] $lane) { if ($lane -eq "beta") { "desktop-dev" } else { "desktop-prod" } }
          function LaneChannel([string] $lane) { if ($lane -eq "beta") { "dev" } else { "prod" } }
          if ($env:PROMOTE_FROM -notin @("beta", "stable")) { "::error title=config::unknown source lane $env:PROMOTE_FROM"; exit 1 }
          if ($env:PROMOTE_TO -notin @("beta", "stable")) { "::error title=config::unknown target lane $env:PROMOTE_TO"; exit 1 }
          if ($env:PROMOTE_FROM -ne $env:PROMOTE_TO) { "::error title=config::cross-lane promotion is forbidden by DEC-0162; restore an artefact into its original lane"; exit 1 }
          $source = if ($env:PROMOTE_SOURCE_TAG) { $env:PROMOTE_SOURCE_TAG } else { LaneTag $env:PROMOTE_FROM }
          "PROMOTE_SOURCE_TAG=$source" >> $env:GITHUB_ENV
          "PROMOTE_TARGET_TAG=$(LaneTag $env:PROMOTE_TO)" >> $env:GITHUB_ENV
          "PROMOTE_CHANNEL=$(LaneChannel $env:PROMOTE_TO)" >> $env:GITHUB_ENV
          "Promote $env:PROMOTE_FROM -> $env:PROMOTE_TO from release $source" >> $env:GITHUB_STEP_SUMMARY
      - name: Download the source artefact (never rebuilt)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP "promote-src"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          gh release download $env:PROMOTE_SOURCE_TAG -p latest.json -D $src
          $manifest = Get-Content (Join-Path $src "latest.json") | ConvertFrom-Json
          $file = $manifest.artifacts.'windows-x86_64'.file
          if (-not $file) { "::error title=config::release $env:PROMOTE_SOURCE_TAG carries no windows-x86_64 artefact"; exit 1 }
          gh release download $env:PROMOTE_SOURCE_TAG -p $file -D $src
          "PROMOTE_SRC=$src" >> $env:GITHUB_ENV
          # Versioned name: the restored feed never points at bytes being replaced.
          "PROMOTE_ASSET=StudiOS-Setup-$env:PROMOTE_CHANNEL-$($manifest.version).exe" >> $env:GITHUB_ENV
      - name: Promote the manifest (same bytes, fail closed on a rebuild)
        shell: pwsh
        working-directory: desktop
        run: |
          node scripts/promote-channel.mjs --dir $env:PROMOTE_SRC --out $env:PROMOTE_SRC --to $env:PROMOTE_TO --url-base "https://github.com/${{ github.repository }}/releases/download/$env:PROMOTE_TARGET_TAG" --asset-name $env:PROMOTE_ASSET --api-url $env:STUDIO_DESKTOP_API_URL
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish to the target lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          trap { "::error title=publish::$($_.Exception.Message)"; exit 1 }
          $tag = $env:PROMOTE_TARGET_TAG
          $asset = Join-Path $env:PROMOTE_SRC $env:PROMOTE_ASSET
          $moving = Join-Path $env:RUNNER_TEMP "StudiOS-Setup-$env:PROMOTE_CHANNEL.exe"
          Copy-Item $asset $moving
          $manifest = Join-Path $env:PROMOTE_SRC "latest.json"
          $version = (Get-Content $manifest | ConvertFrom-Json).version
          $short = "${{ github.sha }}".Substring(0, 7)
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          $label = if ($env:PROMOTE_TO -eq "beta") { "Beta" } else { "Stable" }
          $notes = @(
            "Studi'OS Desktop $label $version, restored from $env:PROMOTE_SOURCE_TAG by manifest (same artefact, same lane, no rebuild, DEC-0108 / DEC-0162).",
            "",
            "API: $env:STUDIO_DESKTOP_API_URL",
            "SHA-256: $hash",
            "",
            "Restoration within $env:PROMOTE_TO. This release is replaced by the next build or restoration of this lane."
          ) -join "`n"
          function Invoke-Checked([string] $step, [scriptblock] $command) {
            $out = & $command 2>&1
            if ($LASTEXITCODE -ne 0) { "::error title=${step}::$(($out | Out-String).Trim() -replace "`r?`n", " ")"; exit 1 }
            $out
          }
          $title = "Studi'OS Desktop $label $version ($short)"
          # @(...) keeps a one-element array: an `if` expression would unroll it to a
          # string, and splatting a string passes each character as an argument.
          $flags = @(if ($env:PROMOTE_TO -eq "beta") { @("--prerelease", "--latest=false") } else { @("--latest") })
          # Never delete before publishing: a failed step must leave the previous
          # release downloadable. The tag is moved with git first, so a refusal
          # stops here with git's own reason and nothing else changed. The lease
          # refuses the move if a channel build moved the tag meanwhile.
          $remote = Invoke-Checked "git ls-remote" { git ls-remote origin "refs/tags/$tag" }
          $expected = if ($remote) { ("$remote" -split "\s+")[0] } else { "" }
          Invoke-Checked "git push tag" { git push -q "--force-with-lease=refs/tags/${tag}:$expected" origin "${{ github.sha }}:refs/tags/$tag" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Versioned installer, then the feed naming it, then the moving name.
            foreach ($file in @($asset, $manifest, $moving)) { Invoke-Checked "gh release upload" { gh release upload $tag $file --clobber } }
            Invoke-Checked "gh release edit" { gh release edit $tag --title $title --notes $notes @flags }
          } else {
            Invoke-Checked "gh release create" { gh release create $tag @($asset, $manifest, $moving) --verify-tag --title $title --notes $notes @flags }
          }
          "Published $tag $version ($hash)" >> $env:GITHUB_STEP_SUMMARY
