name: Deploy

# PARKED: the self-hosted runner this workflow targets cannot run on the
# current production host — Device Guard / WDAC blocks Runner.Listener.exe and
# WSL exposes no general-purpose distro. The active CD is the Windows Scheduled
# Task driver `docker/install-deploy-task.ps1` + `docker/deploy-poll.ps1`.
# This workflow is kept for a runner-capable host and is manual-only on
# purpose, so a push never queues a job that has no runner to pick it up.
#
# Runs on the self-hosted runner installed on that host itself (see
# docker/install-runner.ps1): no inbound access is required, which fits a
# Tailscale-only network with no public DNS.
#
# The job deploys the canonical working copy in $DEPLOY_DIR, NOT the runner's
# own ephemeral checkout, so the gitignored production state (docker/.env,
# docker/.data, docker/backups) is never touched. Only git-tracked files move.

on:
  workflow_dispatch:

concurrency:
  group: studio-os-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: ${{ vars.STUDIO_DEPLOY_DIR || 'C:\Users\redsi\studio-os-deploy' }}
  BRANCH: deploy/flo-laptop
  REPO: ${{ github.repository }}

jobs:
  deploy:
    runs-on: [self-hosted, studio-deploy]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Validate deploy directory
        run: |
          if (-not (Test-Path -LiteralPath "$env:DEPLOY_DIR\.git")) {
            throw "Deploy directory not found or not a git clone: $env:DEPLOY_DIR"
          }

      - name: Fetch and pin the target revision
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $remote = "https://x-access-token:$env:GIT_TOKEN@github.com/$env:REPO.git"
          $prev = git -C "$env:DEPLOY_DIR" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "cannot read current revision" }
          "PREV_REV=$prev" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8

          git -C "$env:DEPLOY_DIR" fetch --prune $remote "+refs/heads/$env:BRANCH:refs/remotes/origin/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }

          git -C "$env:DEPLOY_DIR" reset --hard "origin/$env:BRANCH"
          if ($LASTEXITCODE -ne 0) { throw "git reset failed" }

          $target = git -C "$env:DEPLOY_DIR" rev-parse HEAD
          "TARGET_REV=$target" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Write-Host "previous=$prev target=$target"

      - name: Build application images
        run: |
          Set-Location "$env:DEPLOY_DIR\docker"
          docker compose build api mcp dashboard

      - name: Apply database migrations
        run: |
          Set-Location "$env:DEPLOY_DIR\docker"
          docker compose run --rm api alembic upgrade head

      - name: Recreate application services
        run: |
          Set-Location "$env:DEPLOY_DIR\docker"
          docker compose up -d --no-deps api mcp dashboard

      - name: Wait for the API to become healthy
        run: |
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 -Uri 'http://localhost/healthz'
              if ($r.StatusCode -eq 200) { Write-Host 'API healthy'; exit 0 }
            } catch { }
            Start-Sleep -Seconds 5
          }
          throw 'API did not become healthy within 3 minutes'

      - name: Roll back code on failure
        if: failure() && env.PREV_REV != ''
        run: |
          Write-Host "::warning::Deployment failed — rolling code back to $env:PREV_REV"
          git -C "$env:DEPLOY_DIR" reset --hard "$env:PREV_REV"
          Set-Location "$env:DEPLOY_DIR\docker"
          docker compose build api mcp dashboard
          docker compose up -d --no-deps api mcp dashboard
          Write-Host "::warning::Code rolled back. Database migrations are forward-only and were NOT reverted — run 'alembic downgrade' manually if the schema change must be undone."
