name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: mypy
        run: uv run mypy packages/studio-contracts/src services/api/src services/mcp/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: pytest
        run: uv run pytest -q
