name: CI

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: mypy
        run: uv run mypy packages/studio-contracts/src packages/studio-client/src packages/studio-workspaces/src packages/studio-code-graph/src services/api/src services/mcp/src

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Browser CSP test
        run: npm run test:e2e

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres per .claude/rules/database.md — SQLite never stands in
      # for the shared source of state, even in CI.
      STUDIO_TEST_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_os_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Run migrations against test database
        working-directory: services/api
        run: uv run alembic upgrade head
        env:
          STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_os_test
      - name: Start MinIO
        # A `services:` entry can't be given the `server /data` argument the
        # official image needs to start (GitHub Actions has no way to pass a
        # command to a service container) — run it as a plain background
        # container instead, same image as docker/docker-compose.yml (DEC-0014).
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=studio -e MINIO_ROOT_PASSWORD=studio-dev-secret \
            pgsty/minio:latest@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
      - name: Wait for MinIO and create the test bucket
        # dl.min.io's direct mc binary download now returns an HTML "Gone"
        # page instead of the binary (same MinIO distribution tightening as
        # DEC-0013/DEC-0014) — use the pinned community mc image instead, the
        # same one docker/docker-compose.yml's minio-init service relies on
        # (quay.io/minio images now answer 401, DEC-0014 amendment).
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh pgsty/mc:latest@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd -c "
            mc alias set ci http://localhost:9000 studio studio-dev-secret &&
            mc mb --ignore-existing ci/studio-transfers
          "
      - name: adapters check (canonical projections anti-drift)
        run: uv run --package studio-client studio-client adapters check --repo-root .
      - name: pytest
        run: uv run pytest -n 4 -q --junitxml=pytest-results.xml
      - name: Annotate failing tests
        # Job logs need a signed-in reader; annotations are public.
        if: failure()
        run: |
          uv run python - <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("pytest-results.xml")
          if not path.exists():
              print("::warning::no pytest-results.xml (pytest did not finish)")
              raise SystemExit
          for case in ET.parse(path).getroot().iter("testcase"):
              for problem in [*case.findall("failure"), *case.findall("error")]:
                  name = f"{case.get('classname')}::{case.get('name')}"
                  text = (problem.get("message") or "") + "\n" + (problem.text or "")[-1500:]
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
          EOF
