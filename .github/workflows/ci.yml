name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: mypy
        run: uv run mypy packages/studio-contracts/src packages/studio-client/src services/api/src services/mcp/src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: studio_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres per .claude/rules/database.md — SQLite never stands in
      # for the shared source of state, even in CI.
      STUDIO_TEST_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Run migrations against test database
        working-directory: services/api
        run: uv run alembic upgrade head
        env:
          STUDIO_DATABASE_URL: postgresql+asyncpg://studio:studio@localhost:5432/studio_os_test
      - name: Start MinIO
        # A `services:` entry can't be given the `server /data` argument the
        # official image needs to start (GitHub Actions has no way to pass a
        # command to a service container) — run it as a plain background
        # container instead, same image as docker/docker-compose.yml (DEC-0014).
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=studio -e MINIO_ROOT_PASSWORD=studio-dev-secret \
            quay.io/minio/minio:latest server /data
      - name: Wait for MinIO and create the test bucket
        # dl.min.io's direct mc binary download now returns an HTML "Gone"
        # page instead of the binary (same MinIO distribution tightening as
        # DEC-0013/DEC-0014) — use the quay.io/minio/mc image instead, the
        # same one docker/docker-compose.yml's minio-init service already
        # relies on.
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live > /dev/null && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c "
            mc alias set ci http://localhost:9000 studio studio-dev-secret &&
            mc mb --ignore-existing ci/studio-transfers
          "
      - name: pytest
        run: uv run pytest -q
