name: Desktop release build (manual)

# Builds a signed installer and its updater artifacts; it never publishes a
# GitHub release or an update feed. Publishing stays a separate, human step
# (docs/DESKTOP_P10_PACKAGING.md, "Release procedure").
#
# B4 signing order (fail-closed): Authenticode is applied DURING `tauri build`
# via the bundle.windows overlay (WINDOWS_CERT_THUMBPRINT or PFX import), so
# the minisign updater signatures cover the final signed bytes; the verify
# step then refuses any unsigned executable. STUDIO_REQUIRE_AUTHENTICODE=1
# makes a missing certificate a hard failure instead of a silent unsigned build.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API origin baked into the build"
        required: true
        type: string

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  build-signed:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix ../dashboard
        working-directory: desktop
      - name: Build the installer with the update mechanism compiled in
        run: node scripts/build.mjs --installer --api-url "${{ inputs.api_url }}"
        working-directory: desktop
        env:
          STUDIO_UPDATER_PUBKEY: ${{ secrets.STUDIO_UPDATER_PUBKEY }}
          STUDIO_UPDATER_ENDPOINT: ${{ secrets.STUDIO_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          STUDIO_REQUIRE_AUTHENTICODE: "1"
      - name: Verify Authenticode signatures (fail-closed)
        run: node scripts/windows-signing.mjs --verify --require --dir src-tauri/target/release/bundle/nsis
        working-directory: desktop
      - name: Install, launch, upgrade and uninstall
        run: npm run test:install
        working-directory: desktop
      - name: Hashes and provenance of the release artifacts
        run: node scripts/release-artifacts.mjs --api-url "${{ inputs.api_url }}"
        working-directory: desktop
      - name: Keep the build outputs as a private workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: studio-desktop-release-candidate
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
            desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            desktop/src-tauri/target/release/bundle/nsis/provenance.json
          retention-days: 14
          if-no-files-found: error
