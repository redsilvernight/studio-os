name: Desktop validation

on:
  push:
    # No PR is needed to validate the Desktop: stable, dev and fix/** pushes run it too.
    branches: [master, dev, "fix/**"]
    paths:
      - "desktop/**"
      - "dashboard/**"
      - "packages/studio-client/**"
      - "packages/studio-code-graph/**"
      - "packages/studio-workspaces/**"
      - ".github/workflows/desktop-*.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "dashboard/**"
      - "packages/studio-client/**"
      - "packages/studio-code-graph/**"
      - "packages/studio-workspaces/**"
      - ".github/workflows/desktop-*.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix ../dashboard
        working-directory: desktop
      - name: Version coherence
        run: npm run version:check
        working-directory: desktop
      - name: Rust format, lint and tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml
        working-directory: desktop
      - name: Sidecar data-format and provider tests
        run: uv run pytest -q tests/client/test_data_format.py tests/code_graph tests/workspaces
      - name: Build the unsigned installer
        run: npm run package
        working-directory: desktop
      - name: Install, launch, upgrade and uninstall
        run: npm run test:install
        working-directory: desktop
      - name: Annotate failing install checks
        # Job logs need a signed-in reader; annotations are public.
        if: failure()
        run: node scripts/annotate-results.mjs install-test-results.json
        working-directory: desktop
      - name: Upload the unsigned development installer
        uses: actions/upload-artifact@v6
        with:
          name: studio-desktop-unsigned-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
