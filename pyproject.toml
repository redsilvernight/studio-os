[project]
name = "studio-os"
version = "0.1.0"
description = "Studio OS workspace root (Bloc A: Cloud/Core)"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
studio-contracts = { workspace = true }
studio-api = { workspace = true }
studio-client = { workspace = true }
studio-workspaces = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query()/Header()/Depends() in argument defaults is the documented
# idiom, not the mutable-default footgun B008 flags.
extend-immutable-calls = ["fastapi.Query", "fastapi.Header", "fastapi.Depends", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "services/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Hard per-test bound (fixture setup included): a fixture waiting on an absent
# service fails after 120 s instead of stalling the whole run. Override with
# @pytest.mark.timeout(n) for the long acceptance tests.
timeout = 120
markers = [
    'infra(*services): needs real PostgreSQL and/or MinIO, e.g. infra("minio"); skipped, with the missing service named, when its port does not answer (tests/conftest.py). Run without them: -m "not infra"',
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0",
]
