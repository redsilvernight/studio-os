[project]
name = "studio-mcp"
version = "0.1.0"
description = "Studio OS MCP server — thin tool layer over studio-api's shared services"
requires-python = ">=3.12"
dependencies = ["studio-api", "mcp>=1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_mcp"]
