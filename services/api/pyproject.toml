[project]
name = "studio-api"
version = "0.1.0"
description = "Studio OS Cloud/Core API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "studio-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "prometheus-client>=0.26.0",
  "pyjwt>=2.14.0",
  "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "types-passlib>=1.7.7.20260211",
]

[project.scripts]
studio-admin = "studio_api.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_api"]
