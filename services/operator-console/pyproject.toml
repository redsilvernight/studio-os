[project]
name = "studio-operator"
version = "0.1.0"
description = "Studio OS operator console (separate app: own origin, token, deployment)"
requires-python = ">=3.12"
dependencies = [
  "studio-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "pydantic-settings>=2.4",
  "pyjwt>=2.14.0",
  "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=1.0",
  "httpx>=0.27",
  "pytest-timeout>=2.4.0",
]

[project.scripts]
studio-operator = "studio_operator.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_operator"]
