[project]
name = "studio-code-graph"
version = "0.1.0"
description = "Desktop P7 Code Graph: CodeGraphProvider boundary, isolated Graphify adapter, index lifecycle and Git invalidation"
requires-python = ">=3.12"
dependencies = ["studio-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_code_graph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
