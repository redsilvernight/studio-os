[project]
name = "studio-client"
version = "0.1.0"
description = "Studio OS local client library (Bloc B) — StudioApiClient, config, machine token storage, read-only knowledge adapters. Never depends on studio-api."
requires-python = ">=3.12"
dependencies = [
    "studio-contracts",
    "studio-workspaces",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "keyring>=25.0",
]

[project.scripts]
studio-client = "studio_client.cli:main"
studio-client-daemon = "studio_client.daemon.heartbeat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studio_client"]
