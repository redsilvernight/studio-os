[package]
name = "studio-desktop"
version = "0.1.0"
description = "Studi'OS Desktop - Tauri 2 shell with managed daemon lifecycle"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
webbrowser = "1"
dirs = "6"
# Native folder/file dialogs only (no Tauri plugin, no ACL surface): the shell
# exposes semantic choose_folder/choose_file commands, never a filesystem API.
rfd = { version = "0.15", default-features = false }
tauri-plugin-updater = "2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "perf"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
